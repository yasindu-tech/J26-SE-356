[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "node_modules", "data", "**/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["models", "services"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["notebooks", "data", ".venv"]
