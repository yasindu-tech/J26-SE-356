# Local development stack: Postgres + the backend API.
#
#   docker compose up -d --build          # start both
#   docker compose exec backend python -m app.seed --username yasindu --full-name "Yasindu"
#   docker compose logs -f backend        # watch the API
#   docker compose down                   # stop (the database is kept in the pgdata volume)
#
# Development only: the default passwords and JWT secret below are for this laptop. Both
# ports are bound to 127.0.0.1, so nothing is reachable from the network.
#
# MRI and gait analyses do not run inside this container yet (FSL, ANTs, dcm2niix,
# SynthStrip and the model packages are not in the image). For those, run the backend
# natively against this database; see services/backend/README.md, "Run with Docker".

name: pdxai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdxai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdxai}
      POSTGRES_DB: pdxai
    # 5433 on the host, so it does not clash with a Postgres already running on 5432.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdxai -d pdxai"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg2://pdxai:${POSTGRES_PASSWORD:-pdxai}@db:5432/pdxai
      # The backend refuses this default outside ENVIRONMENT=dev (app/main.py).
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-insecure-secret-change-me}
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
