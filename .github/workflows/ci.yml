name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Only three checks run today: one build per app surface. Everything else
# (lint, tests, the data/PHI and notebook-output guards) is deliberately
# left out for now and will come back as separate jobs once there's real
# code to lint and test. See scripts/setup-branch-protection.sh for the
# required-checks list, which must match the job `name:` values below exactly.
jobs:
  mobile-build:
    name: Mobile Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check app is scaffolded
        id: scaffold
        run: |
          if [ ! -f package.json ]; then
            echo "apps/mobile has no package.json yet — nothing to build. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.scaffold.outputs.skip == 'false'
        run: npm ci || npm install
      - name: Build
        if: steps.scaffold.outputs.skip == 'false'
        run: npm run build --if-present

  desktop-build:
    name: Desktop App Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check app is scaffolded
        id: scaffold
        run: |
          if [ ! -f package.json ]; then
            echo "apps/desktop has no package.json yet — nothing to build. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.scaffold.outputs.skip == 'false'
        run: npm ci || npm install
      - name: Build
        if: steps.scaffold.outputs.skip == 'false'
        run: npm run build --if-present

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check app is scaffolded
        id: scaffold
        run: |
          if [ ! -f requirements.txt ] && [ ! -f pyproject.toml ]; then
            echo "services/backend has no requirements.txt/pyproject.toml yet — nothing to build. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.scaffold.outputs.skip == 'false'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi
      - name: Build check (import + bytecode compile)
        if: steps.scaffold.outputs.skip == 'false'
        run: |
          python -m compileall -q app
          if [ -f app/main.py ]; then python -c "import app.main"; fi
